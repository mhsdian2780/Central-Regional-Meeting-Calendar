<style>
  :root{
    --c-primary:#14538F;
    --c-sub:#EAF2FB;
    --c-accent:#F2820C;
    --c-text:#1F2933;
    --c-sub2:#6B7280;
    --c-weak:#9AA5B1;
    --c-divider:#E5E7EB;
    --c-bg:#FFFFFF;
    --c-mask:rgba(15,23,42,.45);
    --radius-cell:10px;
    --radius-modal:12px;
    --gap:8px;
    --pad-modal:24px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--c-text);
    background:var(--c-bg);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .page{max-width:960px;margin:0 auto;padding:32px 20px 104px;}
  .page-header{margin-bottom:24px;}
  .page-header h1{font-size:22px;font-weight:600;color:var(--c-primary);margin:0 0 6px;}
  .page-header .subtitle{font-size:13px;color:var(--c-sub2);margin:0;}

  /* 星期头 */
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap);margin-bottom:8px;}
  .weekday-row div{font-size:13px;font-weight:500;color:var(--c-sub2);text-align:center;padding:4px 0;}

  /* 网格 */
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap);}
  .day-cell{
    position:relative;
    min-height:62px;
    border:1px solid transparent;
    border-radius:var(--radius-cell);
    background:var(--c-bg);
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    padding:10px 12px;
    font-family:inherit;
  }
  .day-cell.empty{cursor:default;}
  .day-cell.empty .day-num{color:var(--c-weak);}
  .day-cell.active{
    background:var(--c-sub);
    cursor:pointer;
    color:inherit;
    text-align:left;
  }
  .day-cell.active:hover{border-color:var(--c-primary);}
  .day-cell.active:focus-visible{outline:none;border-color:var(--c-primary);}
  .day-num{font-size:22px;font-weight:600;color:var(--c-primary);line-height:1;}
  .badge{
    position:absolute;top:8px;right:8px;
    min-width:20px;height:20px;padding:0 6px;
    border-radius:999px;
    background:var(--c-accent);
    color:var(--c-text);font-size:12px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
    line-height:1;
  }

  /* 底部常驻入口 */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--c-bg);
    border-top:1px solid var(--c-divider);
    display:flex;gap:12px;justify-content:center;
    padding:14px 16px;
    z-index:50;
  }
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--c-sub);
    border:1px solid var(--c-divider);
    border-radius:999px;
    padding:8px 16px;
    font-family:inherit;font-size:14px;font-weight:500;color:var(--c-primary);
    cursor:pointer;
  }
  .chip:hover{border-color:var(--c-primary);}
  .chip .dot{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;
    border-radius:999px;background:var(--c-accent);color:#fff;
    font-size:12px;font-weight:700;
  }

  /* 浮层 */
  .overlay{
    position:fixed;inset:0;
    background:var(--c-mask);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    z-index:100;
  }
  .overlay[hidden]{display:none;}
  .modal{
    width:480px;max-width:92vw;max-height:80vh;
    background:#fff;border-radius:var(--radius-modal);
    padding:var(--pad-modal);
    overflow:auto;
    display:flex;flex-direction:column;
  }
  .modal-header{
    display:flex;align-items:flex-start;gap:12px;
    padding-bottom:16px;margin-bottom:16px;
    border-bottom:1px solid var(--c-divider);
  }
  .header-left{flex:0 0 auto;display:flex;align-items:center;}
  .header-center{flex:1 1 auto;min-width:0;}
  .header-right{flex:0 0 auto;}
  .modal-title{font-size:18px;font-weight:600;color:var(--c-primary);margin:0;}
  .back-btn{
    background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:500;color:var(--c-primary);
    padding:4px 0;margin-right:4px;white-space:nowrap;
  }
  .back-btn:hover{text-decoration:underline;}
  .modal-close{
    background:none;border:none;cursor:pointer;
    font-size:22px;line-height:1;color:var(--c-sub2);
    width:32px;height:32px;border-radius:8px;
  }
  .modal-close:hover{background:var(--c-sub);color:var(--c-primary);}
  .detail-head .zhanyi{font-size:16px;font-weight:600;color:var(--c-text);}
  .detail-head .name{font-size:14px;font-weight:400;color:var(--c-sub2);margin-top:4px;}
  .note{
    background:var(--c-sub);border:1px solid var(--c-divider);
    border-radius:10px;padding:10px 12px;margin-bottom:14px;
    font-size:13px;color:var(--c-text);
  }
  .note strong{color:var(--c-accent);font-weight:600;}
  .item-list{display:flex;flex-direction:column;gap:10px;}
  .item-card{
    text-align:left;width:100%;
    background:#fff;border:1px solid var(--c-divider);
    border-radius:10px;padding:14px 16px;
    cursor:pointer;font-family:inherit;
    display:block;
    transition:background .12s ease;
  }
  .item-card:hover{background:var(--c-sub);}
  .item-card:focus-visible{outline:none;border-color:var(--c-primary);}
  .item-main{font-size:16px;font-weight:600;color:var(--c-text);}
  .item-sub{font-size:14px;font-weight:400;color:var(--c-sub2);margin-top:2px;}
  .item-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;align-items:center;}
  .item-meta-left{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--c-sub2);flex-wrap:wrap;}
  .item-type{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:#EAF2FB;color:#14538F;white-space:nowrap;}
  .item-region{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.5px;}
  .item-owner{font-size:13px;font-weight:500;color:var(--c-text);}
  .item-time{font-size:13px;font-weight:500;color:var(--c-primary);white-space:nowrap;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;}
  .field-label{font-size:13px;font-weight:500;color:var(--c-sub2);margin-bottom:2px;}
  .field-value{font-size:14px;color:var(--c-text);word-break:break-word;}

  /* 区域进度总览 */
  .region-view{display:flex;flex-direction:column;gap:14px;}
  .region-card{border:1px solid var(--c-divider);border-radius:12px;padding:16px 18px;background:#fff;}
  .region-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .region-name{font-size:16px;font-weight:700;letter-spacing:.5px;}
  .region-sum{font-size:13px;color:var(--c-sub2);white-space:nowrap;}
  .region-line{margin-top:12px;}
  .region-line:first-of-type{margin-top:2px;}
  .region-line-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .line-name{font-size:14px;font-weight:700;}
  .line-count{font-size:13px;color:var(--c-sub2);white-space:nowrap;}
  .line-count b{color:var(--c-text);font-weight:600;}
  .prog-track{position:relative;width:100%;height:14px;border-radius:999px;background:#E53935;overflow:hidden;}
  .prog-track.empty{background:var(--c-divider);}
  .prog-fill{position:absolute;left:0;top:0;height:100%;background:#43A047;border-radius:999px 0 0 999px;}
  .prog-fill.zero{border-radius:999px;}

  @media(max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .weekday-row{display:none;}
    .day-cell{min-height:78px;}
    .modal{max-height:85vh;padding:16px;}
    .detail-grid{grid-template-columns:1fr;}
    .page{padding:20px 14px 104px;}
  }

  /* 筛选栏 */
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;align-items:center;}
  .filter{position:relative;}
  .filter-btn{
    display:inline-flex;align-items:center;gap:4px;
    background:#fff;border:1px solid var(--c-divider);border-radius:8px;
    padding:8px 14px;font-family:inherit;font-size:14px;font-weight:500;color:var(--c-primary);
    cursor:pointer;
  }
  .filter-btn:hover{border-color:var(--c-primary);}
  .filter-btn.active{background:var(--c-sub);border-color:var(--c-primary);}
  .filter-count{color:var(--c-sub2);font-weight:400;}
  .filter-btn.active .filter-count{color:var(--c-primary);}
  .filter-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:60;
    background:#fff;border:1px solid var(--c-divider);border-radius:10px;
    box-shadow:0 8px 24px rgba(15,23,42,.12);
    padding:10px;min-width:160px;max-height:300px;overflow:auto;
  }
  .filter-panel[hidden]{display:none;}
  .filter-actions{display:flex;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--c-divider);}
  .filter-link{background:none;border:none;font-family:inherit;font-size:13px;color:var(--c-primary);cursor:pointer;padding:2px 4px;}
  .filter-link:hover{text-decoration:underline;}
  .filter-options{display:flex;flex-direction:column;gap:2px;}
  .filter-opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--c-text);padding:4px 6px;border-radius:6px;cursor:pointer;}
  .filter-opt:hover{background:var(--c-sub);}
  .filter-opt input{width:16px;height:16px;accent-color:var(--c-primary);cursor:pointer;}
  .filter-hint{font-size:12px;line-height:1.5;color:var(--c-sub2);padding:2px 6px 6px;margin-bottom:2px;border-bottom:1px dashed var(--c-divider);}
  .filter-reset{
    background:none;border:1px dashed var(--c-divider);border-radius:8px;
    padding:8px 14px;font-family:inherit;font-size:13px;color:var(--c-sub2);cursor:pointer;
  }
  .filter-reset:hover{border-color:var(--c-primary);color:var(--c-primary);}
  @media(max-width:640px){
    .filter-bar{gap:8px;}
    .filter-panel{min-width:140px;max-width:80vw;}
  }
</style>
</head>

}

  let h = 0;
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function regionColor(region){
  const idx = regionHash(region) % REGION_PALETTE.length;
  return REGION_PALETTE[idx]; // [background, color]
}

/* ===== 筛选（区域 / 战役 / 肺肿线，多选） ===== */
function distinctValues(getter){
  const s = new Set();
  const add = arr => (arr || []).forEach(it => { const v = getter(it); if(v && String(v).trim() !== '') s.add(v); });
  for(const d in DATA.calendar) add(DATA.calendar[d]);
  add(DATA.pending); add(DATA.mismatch);
  return [...s];
}
const regionOptions = distinctValues(it => it.region)
  .sort((a, b) => (a === '中央' ? -1 : b === '中央' ? 1 : a.localeCompare(b, 'zh')));
const zhanyiOptions = (() => {
  const m = {};
  const add = arr => (arr || []).forEach(it => { const v = it.zhanyi; if(v && String(v).trim() !== '') m[v] = (m[v] || 0) + 1; });
  for(const d in DATA.calendar) add(DATA.calendar[d]);
  add(DATA.pending); add(DATA.mismatch);
  return Object.keys(m).sort((a, b) => (m[b] - m[a]) || a.localeCompare(b, 'zh'));
})();
/* 战役 ⇄ 肺肿线 归属映射（同一战役可能横跨早肺/晚肺，有任一场次命中即保留） */
const zhanyiLineMap = (() => {
  const m = {};
  const add = arr => (arr || []).forEach(it => {
    const z = it.zhanyi, l = it.line;
    if(!z || String(z).trim() === '') return;
    if(!m[z]) m[z] = new Set();
    if(l && String(l).trim() !== '') m[z].add(l);
  });
  for(const d in DATA.calendar) add(DATA.calendar[d]);
  add(DATA.pending); add(DATA.mismatch);
  return m;
})();
/* 级联：按已选肺肿线收敛战役选项；未选肺肿线时显示全部战役 */
function currentZhanyiOptions(){
  if(!filters.line.size) return zhanyiOptions;
  const picked = Array.from(filters.line);
  return zhanyiOptions.filter(z => {
    const ls = zhanyiLineMap[z];
    return !!ls && picked.some(l => ls.has(l));
  });
}

const FILTER_DEFS = [
  { key:'region', label:'区域',   getOpts:() => regionOptions },
  { key:'line',   label:'肺肿线', getOpts:() => ['早肺','晚肺'] },
  { key:'zhanyi', label:'战役',   getOpts:currentZhanyiOptions },
];
/* 肺肿线变化后重算战役选项，并剔除已失效的战役勾选 */
function syncZhanyiOptions(){
  const def = FILTER_DEFS.filter(d => d.key === 'zhanyi')[0];
  if(!def || !def._renderOpts) return;
  const visible = currentZhanyiOptions();
  Array.from(filters.zhanyi).forEach(z => { if(visible.indexOf(z) === -1) filters.zhanyi.delete(z); });
  def._renderOpts();
}
const filters = { region:new Set(), zhanyi:new Set(), line:new Set() };

function passFilter(it){
  if(filters.region.size && !filters.region.has(it.region)) return false;
  if(filters.zhanyi.size && !filters.zhanyi.has(it.zhanyi)) return false;
  if(filters.line.size   && !filters.line.has(it.line))     return false;
  return true;
}
function filteredList(arr){ return (arr || []).filter(passFilter); }
function totalFiltered(){
  let n = 0;
  for(const d in DATA.calendar) n += filteredList(DATA.calendar[d]).length;
  return n;
}

let TOTAL = 0, MARKET = 0, REGIONAL = 0;
for(const d in DATA.calendar) for(const it of DATA.calendar[d]){
  TOTAL++;
  if(it.type === '中央市场') MARKET++; else if(it.type === '中央配套') REGIONAL++;
}

function buildFilters(){
  const bar = document.getElementById('filterBar');
  FILTER_DEFS.forEach(def => {
    const wrap = el('div', { class:'filter' });
    const btn = el('button', { class:'filter-btn', attrs:{ type:'button' } });
    const cnt = el('span', { class:'filter-count' });
    btn.appendChild(document.createTextNode(def.label + ' '));
    btn.appendChild(cnt);
    btn.appendChild(document.createTextNode(' ▾'));
    const panel = el('div', { class:'filter-panel', attrs:{ hidden:'' } });
    const actions = el('div', { class:'filter-actions' });
    const all = el('button', { class:'filter-link', attrs:{ type:'button' }, text:'全选' });
    const clr = el('button', { class:'filter-link', attrs:{ type:'button' }, text:'清空' });
    actions.appendChild(all); actions.appendChild(clr);
    const opts = el('div', { class:'filter-options' });
    const renderOpts = () => {
      opts.textContent = '';
      const list = def.getOpts();
      if(def.key === 'zhanyi' && filters.line.size){
        opts.appendChild(el('div', { class:'filter-hint', text:'已按肺肿线「' + Array.from(filters.line).join(' / ') + '」筛选 · 共 ' + list.length + ' 个战役' }));
      }
      if(!list.length){
        opts.appendChild(el('div', { class:'filter-hint', text:'当前肺肿线下无匹配战役' }));
      }
      list.forEach(o => {
        const lab = el('label', { class:'filter-opt' });
        const cb = el('input', { attrs:{ type:'checkbox', value:o } });
        cb.checked = filters[def.key].has(o);
        cb.addEventListener('change', () => {
          if(cb.checked) filters[def.key].add(o); else filters[def.key].delete(o);
          if(def.key === 'line') syncZhanyiOptions();
          onFilterChange();
        });
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(' ' + o));
        opts.appendChild(lab);
      });
    };
    def._renderOpts = renderOpts;
    renderOpts();
    panel.appendChild(actions); panel.appendChild(opts);
    all.addEventListener('click', () => { def.getOpts().forEach(o => filters[def.key].add(o)); renderOpts(); onFilterChange(); });
    clr.addEventListener('click', () => { filters[def.key].clear(); if(def.key === 'line') syncZhanyiOptions(); renderOpts(); onFilterChange(); });
    btn.addEventListener('click', (e) => { e.stopPropagation(); togglePanel(panel); });
    wrap.appendChild(btn); wrap.appendChild(panel);
    bar.appendChild(wrap);
    def._cnt = cnt; def._btn = btn; def._panel = panel;
  });
  const reset = el('button', { class:'filter-reset', attrs:{ type:'button' }, text:'重置筛选' });
  reset.addEventListener('click', () => {
    filters.region.clear(); filters.zhanyi.clear(); filters.line.clear();
    FILTER_DEFS.forEach(d => { if(d._renderOpts) d._renderOpts(); });
    syncFilterUI(); onFilterChange();
  });
  bar.appendChild(reset);
}

function syncFilterUI(){
  FILTER_DEFS.forEach(def => {
    const n = filters[def.key].size;
    def._cnt.textContent = n === 0 ? '（全部）' : `（${n}）`;
    def._btn.classList.toggle('active', n > 0);
    def._panel.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = filters[def.key].has(cb.value); });
  });
}

function togglePanel(panel){
  const isOpen = !panel.hasAttribute('hidden');
  document.querySelectorAll('.filter-panel').forEach(p => p.setAttribute('hidden', ''));
  if(!isOpen) panel.removeAttribute('hidden');
}

function onFilterChange(){
  syncFilterUI();
  renderGrid();
  updateSubtitle();
  const pd = filteredList(DATA.pending).length;
  document.getElementById('dot-pending').textContent = String(pd);
  document.getElementById('chip-pending').style.display = pd === 0 ? 'none' : '';
  const md = filteredList(DATA.mismatch).length;
  document.getElementById('dot-mismatch').textContent = String(md);
  document.getElementById('chip-mismatch').style.display = md === 0 ? 'none' : '';
  if(!overlay.hidden) closeOverlay();
}

function updateSubtitle(){
  const active = filters.region.size || filters.zhanyi.size || filters.line.size;
  const sub = document.getElementById('subtitle');
  if(!active){
    sub.textContent = `数据来源：中央配套 + 中央市场项目排期 · 9月共 ${TOTAL} 场活动安排（中央市场 ${MARKET} 场 · 区域市场 ${REGIONAL} 场）`;
  } else {
    sub.textContent = `已筛选 ${totalFiltered()} 场（共 ${TOTAL} 场）· 点击日期查看当日明细`;
  }
}

/* 点击筛选栏以外区域关闭下拉 */
document.addEventListener('click', (e) => {
  if(!e.target.closest('.filter')){
    document.querySelectorAll('.filter-panel').forEach(p => p.setAttribute('hidden', ''));
  }
});

/* ===== 状态 ===== */
let state = { level:'list', listKind:'day', day:null, index:null };
let lastTrigger = null;

const overlay   = document.getElementById('overlay');
const modal     = document.getElementById('modal');
const headerLeft  = document.getElementById('headerLeft');
const headerCenter= document.getElementById('headerCenter');
const modalBody = document.getElementById('modalBody');
const closeBtn  = document.getElementById('closeBtn');

/* ===== L1 网格渲染 ===== */
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const first = new Date(YEAR, MONTH, 1);
  const lead = (first.getDay() + 6) % 7; // 周一为每周起始
  const today = new Date();
  const isSeptNow = (today.getFullYear() === YEAR && today.getMonth() === MONTH);

  for(let i = 0; i < lead; i++){
    grid.appendChild(el('div', { class:'day-cell empty' }));
  }
  for(let d = 1; d <= 30; d++){
    const items = filteredList(DATA.calendar[String(d)]);
    if(items.length > 0){
      const cell = el('button', {
        class:'day-cell active',
        attrs:{ 'type':'button', 'data-day':String(d), 'aria-label':`9月${d}日 共${items.length}场` },
        on:{ click:(ev) => openDay(d, ev.currentTarget) }
      });
      cell.appendChild(el('span', { class:'day-num', text:String(d) }));
      cell.appendChild(el('span', { class:'badge', text:String(items.length) }));
      if(isSeptNow && today.getDate() === d){
        cell.style.boxShadow = 'inset 0 0 0 2px var(--c-primary)';
      }
      grid.appendChild(cell);
    } else {
      const cell = el('div', { class:'day-cell empty' });
      cell.appendChild(el('span', { class:'day-num', text:String(d) }));
      grid.appendChild(cell);
    }
  }
}

/* ===== 数据获取 ===== */
function currentItems(){
  if(state.listKind === 'day') return filteredList(DATA.calendar[String(state.day)]);
  if(state.listKind === 'pending') return filteredList(DATA.pending);
  if(state.listKind === 'mismatch') return filteredList(DATA.mismatch);
  return [];
}

/* ===== 卡片 ===== */
function buildCard(item, idx){
  const card = el('button', {
    class:'item-card', attrs:{ 'type':'button' },
    on:{ click:() => openDetail(idx) }
  });
  card.appendChild(el('div', { class:'item-main', text: item.zhanyi }));
  card.appendChild(el('div', { class:'item-sub', text: item.name }));
  const meta = el('div', { class:'item-meta' });
  const metaLeft = el('div', { class:'item-meta-left' });
  metaLeft.appendChild(el('span', { class:'item-type', text: item.type || '—' }));
  const [rbg, rfg] = regionColor(item.region);
  metaLeft.appendChild(el('span', {
    class:'item-region', text: val(item.region),
    attrs:{ style:`background:${rbg};color:${rfg};` }
  }));
  metaLeft.appendChild(el('span', { class:'item-owner', text:`负责人：${val(item.filler)}` }));
  meta.appendChild(metaLeft);
  meta.appendChild(el('span', { class:'item-time', text: shortTime(item.time) }));
  card.appendChild(meta);
  return card;
}

/* ===== 浮层渲染 ===== */
function renderOverlay(){
  if(state.view === 'region'){ renderRegionView(); return; }
  headerLeft.innerHTML = '';
  headerCenter.innerHTML = '';
  modalBody.innerHTML = '';

  if(state.level === 'list'){
    // 标题
    const items = currentItems();
    let titleText;
    if(state.listKind === 'day'){
      titleText = `9月${state.day}日 · 周${weekdayCN(state.day)}（${items.length}场）`;
    } else if(state.listKind === 'pending'){
      titleText = `时间待定（${items.length}）`;
    } else {
      titleText = `月份不一致（${items.length}）`;
    }
    headerCenter.appendChild(el('h2', { class:'modal-title', attrs:{ id:'modalTitle' }, text: titleText }));
    modal.setAttribute('aria-label', titleText);

    if(state.listKind === 'mismatch'){
      modalBody.appendChild(el('div', { class:'note', html:'异常：<strong>活动月份标9月但活动时间写10月15日</strong>' }));
    }
    const list = el('div', { class:'item-list' });
    items.forEach((it, i) => list.appendChild(buildCard(it, i)));
    modalBody.appendChild(list);
  } else {
    // 详情：← 返回 + 头部战役/活动名
    const back = el('button', { class:'back-btn', attrs:{ type:'button' }, text:'← 返回', on:{ click: backToList } });
    headerLeft.appendChild(back);

    const item = currentItems()[state.index];
    const head = el('div', { class:'detail-head' });
    head.appendChild(el('div', { class:'zhanyi', text: val(item.zhanyi) }));
    head.appendChild(el('div', { class:'name', text: val(item.name) }));
    headerCenter.appendChild(head);
    modal.setAttribute('aria-label', val(item.zhanyi) + ' · ' + val(item.name));

    const grid = el('div', { class:'detail-grid' });
    FIELDS.forEach(([label, key]) => {
      const f = el('div', { class:'field' });
      f.appendChild(el('div', { class:'field-label', text: label }));
      f.appendChild(el('div', { class:'field-value', text: val(item[key]) }));
      grid.appendChild(f);
    });
    modalBody.appendChild(grid);
  }
}

/* ===== 区域进度总览 ===== */
function computeRegionStats(){
  // 仅统计 9 月当月数据（与日历一致），并应用当前筛选
  const items = [];
  for(const d in DATA.calendar) for(const it of DATA.calendar[d]) if(passFilter(it)) items.push(it);
  for(const it of DATA.pending) if(passFilter(it)) items.push(it);

  const byRegion = {};
  for(const it of items){
    const region = val(it.region);
    const line = (it.line || '').trim();
    if(line !== '早肺' && line !== '晚肺') continue; // 仅统计早肺/晚肺
    const done = (it.status || '').trim() === '已完成';
    byRegion[region] = byRegion[region] || { region: region, early:{ total:0, done:0 }, late:{ total:0, done:0 } };
    const b = byRegion[region];
    if(line === '早肺'){ b.early.total++; if(done) b.early.done++; }
    else { b.late.total++; if(done) b.late.done++; }
  }

  const arr = Object.values(byRegion).filter(b => b.early.total || b.late.total);
  const ratio = b => { const t = b.early.total + b.late.total, dn = b.early.done + b.late.done; return t ? dn / t : 0; };
  const total = b => b.early.total + b.late.total;
  // 先按已完成占比降序，再按总数量降序
  arr.sort((a, b) => (ratio(b) - ratio(a)) || (total(b) - total(a)));
  return arr;
}

function renderRegionView(){
  headerLeft.innerHTML = '';
  headerCenter.innerHTML = '';
  modalBody.innerHTML = '';
  headerCenter.appendChild(el('h2', { class:'modal-title', attrs:{ id:'modalTitle' }, text:'各区域完成进度' }));
  modal.setAttribute('aria-label', '各区域完成进度');

  modalBody.appendChild(el('div', { class:'note', html:'进度条：<strong style="color:#43A047">绿色=已完成</strong> · <strong style="color:#E53935">红色=未完成</strong>；仅统计 9 月当月（与日历一致），口径：仅执行情况为「已完成」计入完成。' }));

  const stats = computeRegionStats();
  const view = el('div', { class:'region-view' });
  if(stats.length === 0){
    view.appendChild(el('div', { class:'item-sub', text:'暂无符合条件的项目数据' }));
  }
  stats.forEach(b => {
    const card = el('div', { class:'region-card' });
    const [rbg, rfg] = regionColor(b.region);
    const t = b.early.total + b.late.total, dn = b.early.done + b.late.done;
    const head = el('div', { class:'region-card-head' });
    head.appendChild(el('span', { class:'region-name', text: b.region, attrs:{ style:`color:${rbg};` } }));
    head.appendChild(el('span', { class:'region-sum', text:`合计 已完成 ${dn} / 总 ${t}` }));
    card.appendChild(head);

    [['早肺', b.early], ['晚肺', b.late]].forEach(([ln, lg]) => {
      const line = el('div', { class:'region-line' });
      const lh = el('div', { class:'region-line-head' });
      lh.appendChild(el('span', { class:'line-name', text: ln, attrs:{ style:`color:${rbg};` } }));
      lh.appendChild(el('span', { class:'line-count', html:`已完成 <b>${lg.done}</b> / 总 <b>${lg.total}</b>` }));
      line.appendChild(lh);
      const track = el('div', { class:'prog-track' + (lg.total === 0 ? ' empty' : '') });
      const pct = lg.total ? Math.round(lg.done / lg.total * 100) : 0;
      const fill = el('div', { class:'prog-fill' + (lg.done === 0 ? ' zero' : '') });
      if(lg.total > 0) fill.setAttribute('style', `width:${pct}%;`);
      track.appendChild(fill);
      line.appendChild(track);
      card.appendChild(line);
    });
    view.appendChild(card);
  });
  modalBody.appendChild(view);
}

/* ===== 交互 ===== */
function openDay(d, trigger){
  state = { level:'list', listKind:'day', day:d, index:null };
  renderOverlay();
  openOverlay(trigger);
}
function openList(kind, trigger){
  state = { level:'list', listKind:kind, day:null, index:null };
  renderOverlay();
  openOverlay(trigger);
}
function openRegion(trigger){
  state = { view:'region' };
  renderOverlay();
  openOverlay(trigger);
}
function openDetail(idx){
  state.index = idx;
  state.level = 'detail';
  renderOverlay();
  const b = headerLeft.querySelector('.back-btn');
  if(b) b.focus();
}
function backToList(){
  state.level = 'list';
  renderOverlay();
  closeBtn.focus();
}
function openOverlay(trigger){
  lastTrigger = trigger || document.activeElement;
  overlay.hidden = false;
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}
function closeOverlay(){
  if(overlay.hidden) return;
  overlay.hidden = true;
  document.body.style.overflow = '';
  if(lastTrigger && typeof lastTrigger.focus === 'function') lastTrigger.focus();
}

/* 遮罩点击关闭 */
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeOverlay(); });
/* × 关闭 */
closeBtn.addEventListener('click', closeOverlay);
/* Esc 关闭 */
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && !overlay.hidden) closeOverlay(); });
/* 焦点陷阱 */
overlay.addEventListener('keydown', (e) => {
  if(e.key !== 'Tab') return;
  const f = overlay.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
  if(f.length === 0) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* 底部入口 */
document.getElementById('chip-region').addEventListener('click', (e) => openRegion(e.currentTarget));
document.getElementById('chip-pending').addEventListener('click', (e) => openList('pending', e.currentTarget));
document.getElementById('chip-mismatch').addEventListener('click', (e) => openList('mismatch', e.currentTarget));
document.getElementById('dot-pending').textContent = String(DATA.pending.length);
document.getElementById('dot-mismatch').textContent = String(DATA.mismatch.length);

// 副标题由 updateSubtitle() 根据筛选动态生成（TOTAL / MARKET / REGIONAL 已在筛选区块计算）

// 无数据时隐藏对应入口
if (DATA.pending.length === 0) document.getElementById('chip-pending').style.display = 'none';
if (DATA.mismatch.length === 0) document.getElementById('chip-mismatch').style.display = 'none';

/* 初始化 */
buildFilters();
syncFilterUI();
updateSubtitle();
renderGrid();
</script>
</body>
</html>
